name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon). Rosetta 2 runs this natively on Intel Macs too.
          # macos-13 (Intel) is excluded — GitHub has deprecated that runner pool
          # and jobs queue indefinitely waiting for an unavailable runner.
          - os: macos-latest
            arch: arm64
            artifact_name: locallens-mcp
            asset_suffix: macos-arm64
            archive_cmd: zip -j locallens-mcp-${{ github.ref_name }}-macos-arm64.zip dist/locallens-mcp
            archive_file: locallens-mcp-${{ github.ref_name }}-macos-arm64.zip
          - os: windows-latest
            arch: x86_64
            artifact_name: locallens-mcp.exe
            asset_suffix: windows-x86_64
            archive_cmd: Compress-Archive -Path dist/locallens-mcp.exe -DestinationPath locallens-mcp-${{ github.ref_name }}-windows-x86_64.zip
            archive_file: locallens-mcp-${{ github.ref_name }}-windows-x86_64.zip
          - os: ubuntu-22.04
            arch: x86_64
            artifact_name: locallens-mcp
            asset_suffix: linux-x86_64
            archive_cmd: tar -czf locallens-mcp-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist locallens-mcp
            archive_file: locallens-mcp-${{ github.ref_name }}-linux-x86_64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Build binary with PyInstaller
        run: |
          pyinstaller locallens-mcp.spec

      - name: Smoke-test the binary
        # PyInstaller only WARNS about imports it cannot resolve, so a green
        # build says nothing about whether the binary actually starts. v1.0.29
        # shipped binaries built against mcp 2.0.0, which had removed
        # mcp.server.fastmcp — every job passed and every artifact crashed on
        # launch. --claude-status walks the real import graph, needs no Claude
        # Desktop installed, and exits 0 anywhere, so it is a valid check on a
        # bare runner. Asserting the reported version also catches a release
        # built from a stale or unbumped tree.
        shell: bash
        env:
          # Empty on workflow_dispatch, where ref_name is a branch. The startup
          # check still runs; only the version comparison is skipped.
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          BIN: ./dist/${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          out=$("$BIN" --claude-status)
          echo "$out"
          echo "$out" | python -c "import json,os,sys; v=json.load(sys.stdin)['version']; t=os.environ['TAG'].lstrip('v'); sys.exit(None if not t or v==t else 'version mismatch: binary reports %s, tag is %s' % (v,t))"
          echo "OK: binary starts and its imports resolve"

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: ${{ matrix.archive_cmd }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.archive_cmd }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tray-mac:
    name: Build Tray App (macOS - arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    # Single arm64 build. Apple Silicon is 90%+ of active Macs.
    # Rosetta 2 runs this binary transparently on Intel hardware.
    # macos-13 (Intel runner) is excluded — GitHub deprecated that pool;
    # jobs queue indefinitely waiting for an unavailable runner.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[tray]" py2app

      - name: Build tray .app bundle
        # py2app uses setup_tray_mac.py (distutils-style), which conflicts with
        # pyproject.toml when both exist in the same directory. We temporarily
        # rename pyproject.toml so py2app's modulegraph doesn't choke on it.
        timeout-minutes: 30
        run: |
          mv pyproject.toml pyproject.toml.bak
          python setup_tray_mac.py py2app
          mv pyproject.toml.bak pyproject.toml

      - name: Smoke-test the bundled MCP server
        # Claude Desktop runs the .app's embedded python as
        # `-m mcp_server.main` (see get_mcp_command_config in
        # claude_connector.py), so the bundle has to satisfy that import graph
        # on its own. py2app's `packages` list is maintained by hand, so a
        # dependency that moves or disappears upstream is only caught by
        # actually running it — which is how the mcp 2.0.0 break surfaced.
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          out=$("dist/LocalLens Agent.app/Contents/MacOS/python" -m mcp_server.main --claude-status)
          echo "$out"
          echo "$out" | python -c "import json,os,sys; v=json.load(sys.stdin)['version']; t=os.environ['TAG'].lstrip('v'); sys.exit(None if not t or v==t else 'version mismatch: bundle reports %s, tag is %s' % (v,t))"
          echo "OK: bundled MCP server starts and its imports resolve"

      - name: Ad-hoc sign the app bundle
        # This is NOT a full Apple notarization (which requires a paid Developer
        # account), but it removes the "app is damaged" error and is required for
        # the xattr quarantine removal in the Homebrew Cask to work reliably.
        # Full notarization can be layered on later by adding APPLE_CERTIFICATE
        # secrets — the signing step below would be replaced by a proper identity.
        run: |
          codesign --deep --force --sign - "dist/LocalLens Agent.app"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG (with app + Gatekeeper fix script)
        # The fix_locallens_agent.command file is bundled inside the DMG so that
        # users who install manually can just double-click it — no Terminal needed.
        #
        # create-dmg (not raw hdiutil) so the DMG opens as the conventional
        # "drag the app onto Applications" window instead of a bare folder.
        run: |
          chmod +x fix_locallens_agent.command

          # Stage DMG contents: app + fix script
          mkdir -p dmg_staging
          cp -r "dist/LocalLens Agent.app" dmg_staging/
          cp fix_locallens_agent.command "dmg_staging/Fix LocalLens Agent.command"

          DMG="locallens-agent-${{ github.ref_name }}-macos-arm64.dmg"

          # create-dmg exits non-zero when it can't set the volume icon on a
          # headless runner even though the DMG itself is fine, so gate the
          # failure on the artifact actually being absent rather than on $?.
          create-dmg \
            --volname "LocalLens Agent" \
            --volicon "icons/ll_red_trans/icon.icns" \
            --window-pos 200 120 \
            --window-size 560 380 \
            --icon-size 110 \
            --icon "LocalLens Agent.app" 150 170 \
            --app-drop-link 410 170 \
            --icon "Fix LocalLens Agent.command" 280 310 \
            --hide-extension "LocalLens Agent.app" \
            "$DMG" dmg_staging/ || true

          if [ ! -f "$DMG" ]; then
            echo "::error::create-dmg did not produce $DMG"
            exit 1
          fi

      - name: Upload tray DMG
        uses: softprops/action-gh-release@v2
        with:
          files: locallens-agent-${{ github.ref_name }}-macos-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tray-win:
    name: Build Tray App (Windows - x86_64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[tray]" pyinstaller

      - name: Build tray app with PyInstaller
        run: pyinstaller locallens-tray-win.spec

      - name: Build locallens-mcp.exe and bundle it alongside the tray
        # get_mcp_command_config() (claude_connector.py) looks for
        # locallens-mcp.exe next to the tray's own executable when running
        # as a bundled PyInstaller build. Without it, "Connect to Claude"
        # falls through to a PATH search and fails on machines that never
        # separately pip-installed locallens-mcp.
        shell: pwsh
        run: |
          pyinstaller locallens-mcp.spec
          Copy-Item "dist\locallens-mcp.exe" "dist\LocalLens Agent\locallens-mcp.exe"

      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\LocalLens Agent\LocalLens Agent.exe")) {
            Write-Error "PyInstaller output not found at dist\LocalLens Agent\"
            Get-ChildItem dist -Recurse | Select-Object FullName
            exit 1
          }
          if (-not (Test-Path "dist\LocalLens Agent\locallens-mcp.exe")) {
            Write-Error "locallens-mcp.exe was not bundled into dist\LocalLens Agent\"
            exit 1
          }
          Write-Host "PyInstaller output OK:"
          Get-ChildItem "dist\LocalLens Agent" | Select-Object Name, Length

      - name: Smoke-test the bundled locallens-mcp.exe
        # The step above only proves the files exist — which they also did for
        # v1.0.29, whose binaries could not start. Run it for real.
        shell: bash
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          out=$("dist/LocalLens Agent/locallens-mcp.exe" --claude-status)
          echo "$out"
          echo "$out" | python -c "import json,os,sys; v=json.load(sys.stdin)['version']; t=os.environ['TAG'].lstrip('v'); sys.exit(None if not t or v==t else 'version mismatch: exe reports %s, tag is %s' % (v,t))"
          echo "OK: bundled locallens-mcp.exe starts and its imports resolve"

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Generate MUI2 welcome bitmap
        # MUI_WELCOMEFINISHPAGE_BITMAP needs a 164x314 BMP3 with no alpha
        # channel. Generated from the shipped app icon rather than committed,
        # so the installer artwork can never drift from icons/ll_red_trans/.
        # Pillow is already present via .[tray].
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\installer | Out-Null
          python -c "from PIL import Image; c = Image.new('RGB', (164, 314), 'white'); l = Image.open('icons/ll_red_trans/icon.png').convert('RGBA').resize((128, 128)); c.paste(l, (18, 40), l); c.save('build/installer/welcome.bmp', 'BMP')"
          if (-not (Test-Path "build\installer\welcome.bmp")) {
            Write-Error "welcome.bmp was not generated"
            exit 1
          }

      - name: Build NSIS installer
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DAPP_VERSION=${{ github.ref_name }} installer_win.nsi
          Move-Item locallens-agent-installer.exe "locallens-agent-${{ github.ref_name }}-windows-x86_64-setup.exe"

      - name: Upload Windows installer
        uses: softprops/action-gh-release@v2
        with:
          files: locallens-agent-${{ github.ref_name }}-windows-x86_64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

