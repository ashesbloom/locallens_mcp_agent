  update-version-manifest:
    # Publishes mcp.latest AND the download URLs/checksums in ONE commit.
    # scripts/set_version.py deliberately no longer touches mcp.latest: when the
    # release commit bumped it, every installed client saw a new version
    # announced with the PREVIOUS release's download block for as long as these
    # builds took (plus up to 24h of client-side manifest cache), so "Install
    # Update" either 404'd into the browser or — when the stale url+sha pair was
    # self-consistent — silently reinstalled the old version.
    name: Publish release notes + version.json (latest + checksums)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `build` is included so the MCP binaries exist before the release notes
    # link to them — otherwise the published body 404s for the first few minutes.
    needs: [build, build-tray-mac, build-tray-win]
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch asset digests from the release
        # GitHub computes and stores a SHA256 digest for every uploaded asset —
        # no need to re-download multi-hundred-MB binaries just to hash them.
        id: digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAC_ASSET="locallens-agent-${{ github.ref_name }}-macos-arm64.dmg"
          WIN_ASSET="locallens-agent-${{ github.ref_name }}-windows-x86_64-setup.exe"

          MAC_SHA=$(gh release view ${{ github.ref_name }} --json assets \
            --jq ".assets[] | select(.name == \"$MAC_ASSET\") | .digest" | sed 's/^sha256://')
          WIN_SHA=$(gh release view ${{ github.ref_name }} --json assets \
            --jq ".assets[] | select(.name == \"$WIN_ASSET\") | .digest" | sed 's/^sha256://')

          if [ -z "$MAC_SHA" ] || [ -z "$WIN_SHA" ]; then
            echo "::error::Could not resolve asset digest(s) — mac='$MAC_SHA' win='$WIN_SHA'"
            exit 1
          fi

          echo "mac_asset=$MAC_ASSET" >> $GITHUB_OUTPUT
          echo "win_asset=$WIN_ASSET" >> $GITHUB_OUTPUT
          echo "mac_sha256=$MAC_SHA" >> $GITHUB_OUTPUT
          echo "win_sha256=$WIN_SHA" >> $GITHUB_OUTPUT

      - name: Publish release notes as the GitHub release body
        # scripts/set_version.py has generated release_notes/release_notes_v*.md
        # since v1.0.16 and not one was ever published: no upload step passed
        # body_path, so `gh release view <tag> --json body` returned "" for every
        # release. Published from this job rather than the three upload jobs
        # because those run concurrently and would race for the same body — this
        # job is already downstream of all of them and already holds the digests.
        #
        # Runs BEFORE version.json so no client is offered an update whose
        # release page is still blank. If it fails, assets are up but mcp.latest
        # is not advanced — nobody is notified, which is the safe direction.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="release_notes/release_notes_v${TAG#v}.md"

          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES not found — run scripts/set_version.py ${TAG#v} before tagging"
            exit 1
          fi
          if grep -qE '\{VERSION\}|\{RELEASE_SECTIONS\}' "$NOTES"; then
            echo "::error::$NOTES still contains unreplaced template placeholders"
            exit 1
          fi

          # Checksums are appended at publish time and never committed — a digest
          # stored in the repo copy is stale the moment an asset is rebuilt.
          #
          # Heredoc bodies MUST stay indented to this block scalar's level: YAML
          # strips the common indent, so bash still receives them at column 0.
          # Un-indenting them ends the scalar, and a bare "---" then parses as a
          # second YAML document.
          BODY=$(mktemp)
          cp "$NOTES" "$BODY"
          # Force a trailing blank line before appending. Markdown reads "---"
          # directly under a text line as a setext H2 underline, so without this
          # the notes' closing italic line renders as a giant heading. Done here
          # rather than only in the generator so notes files committed by older
          # versions of set_version.py are handled too.
          printf '\n' >> "$BODY"
          cat >> "$BODY" <<'EOF'

          ---

          ## 🔐 Verify your download

          Both installers are unsigned, so it is worth checking the SHA256 before you run them.

          | Asset | SHA256 |
          |---|---|
          EOF
          cat >> "$BODY" <<EOF
          | \`${{ steps.digests.outputs.mac_asset }}\` | \`${{ steps.digests.outputs.mac_sha256 }}\` |
          | \`${{ steps.digests.outputs.win_asset }}\` | \`${{ steps.digests.outputs.win_sha256 }}\` |
          EOF
          cat >> "$BODY" <<'EOF'

          ```bash
          shasum -a 256 <file>                 # macOS / Linux
          certutil -hashfile <file> SHA256     # Windows
          ```
          EOF

          gh release edit "$TAG" --notes-file "$BODY"
          echo "Published release notes for $TAG ($(wc -l < "$BODY") lines)"

      - name: Update version.json
        run: |
          TAG="${{ github.ref_name }}"
          LATEST="${TAG#v}"
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
          # latest + downloads in one jq expression: the manifest must never be
          # readable in a state where they disagree.
          jq --arg latest "$LATEST" \
             --arg macUrl "$REPO_URL/${{ steps.digests.outputs.mac_asset }}" \
             --arg macSha "${{ steps.digests.outputs.mac_sha256 }}" \
             --arg winUrl "$REPO_URL/${{ steps.digests.outputs.win_asset }}" \
             --arg winSha "${{ steps.digests.outputs.win_sha256 }}" \
             '.mcp.latest = $latest
              | .mcp.downloads = {
                  "macos-arm64": {"url": $macUrl, "sha256": $macSha},
                  "windows-x86_64": {"url": $winUrl, "sha256": $winSha}
                }' version.json > version.json.tmp
          mv version.json.tmp version.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: publish ${{ github.ref_name }} in version.json (latest + downloads)"
          git push origin HEAD:main

  update-homebrew-cask:
    name: Update Homebrew Cask
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-tray-mac
    steps:
      - name: Download arm64 DMG
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ github.ref_name }}
          fileName: locallens-agent-${{ github.ref_name }}-macos-arm64.dmg
          out-file-path: dmg_downloads

      - name: Compute SHA256 checksum
        id: sha
        run: |
          ARM64_SHA=$(shasum -a 256 "dmg_downloads/locallens-agent-${{ github.ref_name }}-macos-arm64.dmg" | awk '{print $1}')
          echo "arm64=$ARM64_SHA" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ashesbloom/homebrew-locallens
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Cask formula
        run: |
          VERSION="${{ steps.sha.outputs.version }}"
          ARM64_SHA="${{ steps.sha.outputs.arm64 }}"

          CASK="homebrew-tap/Casks/locallens-agent.rb"

          # Bootstrap the cask file if it does not yet exist in the tap repo
          if [ ! -f "$CASK" ]; then
            mkdir -p "$(dirname "$CASK")"
            {
              printf 'cask "locallens-agent" do\n'
              printf '  version "PLACEHOLDER_VERSION"\n'
              printf '\n'
              printf '  url "https://github.com/ashesbloom/locallens_mcp_agent/releases/download/v#{version}/locallens-agent-v#{version}-macos-arm64.dmg"\n'
              printf '  sha256 "PLACEHOLDER_SHA"\n'
              printf '\n'
              printf '  name "LocalLens Agent"\n'
              printf '  desc "System tray agent for LocalLens privacy-first photo organizer"\n'
              printf '  homepage "https://locallens.app"\n'
              printf '\n'
              printf '  app "LocalLens Agent.app"\n'
              printf '\n'
              printf '  zap trash: [\n'
              printf '    "~/.config/LocalLens",\n'
              printf '  ]\n'
              printf 'end\n'
            } > "$CASK"
            echo "Bootstrapped new cask file from template"
          fi

          # Replace version and sha256 values in-place
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$CASK"
          sed -i "s/sha256 \".*\"/sha256 \"${ARM64_SHA}\"/" "$CASK"

          echo "Updated Cask to v${VERSION}"
          cat "$CASK"

      - name: Commit and push Cask update
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/locallens-agent.rb
          git commit -m "chore: update locallens-agent to ${{ github.ref_name }}"
          git push
