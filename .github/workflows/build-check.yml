name: CI Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Runs before the install on purpose: it is pure stdlib, needs nothing
      # installed, and fails in seconds. An undeclared import is invisible to
      # PyInstaller, to the release smoke test and to a dev venv that happens to
      # have the package — it only breaks for users. See the script's docstring.
      - name: Audit optional imports
        run: |
          python scripts/check_optional_imports.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run pytest
        run: |
          python -m pytest tests/ -v

  build-check:
    name: Build Check (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Test PyInstaller build
        run: |
          pyinstaller locallens-mcp.spec
          dist/locallens-mcp --help
