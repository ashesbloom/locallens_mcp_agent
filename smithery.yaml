# Smithery configuration: https://smithery.ai/docs/config#smitheryyaml
# LL Agent — bridges AI assistants to the LocalLens privacy-first photo organizer.
# Requires the LocalLens desktop app running locally (https://locallensmcp.vercel.app).
name: locallens-mcp
target: local

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: "uvx",
      args: ["locallens-mcp"],
      env: { "LOCALLENS_STORE_URL": "https://locallensmcp.vercel.app" }
    })
