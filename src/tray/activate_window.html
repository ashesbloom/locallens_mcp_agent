<html lang="en">
<head>
<meta charset="utf-8">
<title>Activate LL Agent Pro</title>
<style>
:root{--paper:#FAF9F6;--ink:#14161B;--muted:#5E626B;--brand:#FF5A2B;--stage:#0E1014;--line:#DEDBD3}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
[hidden]{display:none !important}
/* 100vh, not 640px: with Windows display scaling the window's client area comes out a little shorter than asked for, and a fixed box clipped the buttons. */
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--paper)}
.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

/* title strip */
#bar{position:absolute;top:0;left:0;right:0;height:40px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 16px;color:var(--ink)}
#bar.dark{color:#F4F2EC}
.mark{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(255,90,43,.22)}
#close{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* entry */
#form{position:absolute;left:0;right:0;top:40px;bottom:0;z-index:1;padding:22px 48px 28px;display:flex;flex-direction:column;box-sizing:border-box}
.lens{width:88px;height:88px;border-radius:50%;margin:0 auto;background:linear-gradient(135deg,#ff7040 0%,#c83000 35%,#ff5a2b 65%,#c83000 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(200,48,0,.22)}
.glass{width:72px;height:72px;border-radius:50%;overflow:hidden;position:relative;background:radial-gradient(circle at 35% 30%,rgba(142,200,234,.9),rgba(17,24,32,.95) 70%)}
.glass svg{position:absolute;left:-11.4px;top:-11.4px;width:94.7px;height:94.7px}
.glint{position:absolute;left:20px;top:16px;width:18px;height:10px;border-radius:50%;background:rgba(255,255,255,.28);transform:rotate(-35deg)}
.bl{fill:#14161B;stroke:#2C313A;stroke-width:.6;transform-box:fill-box;transform-origin:50% 100%;transform:rotate(34deg)}
.lens.hunt .bl{animation:hunt 1.1s ease-in-out infinite}
@keyframes hunt{0%{transform:rotate(36deg)}30%{transform:rotate(12deg)}55%{transform:rotate(28deg)}78%{transform:rotate(18deg)}100%{transform:rotate(36deg)}}
.eyebrow{margin:18px 0 0;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--muted)}
h1{margin:6px 0 0;text-align:center;font-size:30px;font-weight:700;letter-spacing:-.02em}
.lede{margin:8px auto 0;max-width:360px;text-align:center;font-size:14px;line-height:1.5;color:var(--muted)}
label{margin-top:22px;font-size:12px;font-weight:600}
.field{position:relative;margin-top:6px}
#key{width:100%;box-sizing:border-box;height:50px;padding:0 92px 0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink);outline-color:var(--brand);-webkit-user-select:text;user-select:text}
.field.bad #key{border-color:#D2401A}
.field.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#paste{position:absolute;right:6px;top:6px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#F4F2EC;font:inherit;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
#paste:hover{background:#ECE9E1}
#err{margin-top:12px;display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:#FCEEEA;color:#7A240F;font-size:13px;line-height:1.45}
#err strong{display:block;font-weight:600}
#activate{margin-top:16px;height:50px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
#activate:hover:enabled{background:#2A2E36}
#activate:disabled{opacity:.45;cursor:not-allowed}
.spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{margin:14px 0 0;text-align:center;font-size:12px;line-height:1.5;color:var(--muted)}
.link{border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* stage */
#stage{position:absolute;inset:0;z-index:2;background:var(--stage);color:#F4F2EC}
#storm{position:absolute;left:0;top:0;width:520px;height:640px;display:block}
#skip{position:absolute;inset:0;z-index:3;border:0;background:transparent;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px}
#skip span{font-size:11px;letter-spacing:.16em;color:#6C717B;animation:fade .4s ease-out .9s both}
#final{position:absolute;left:0;right:0;top:150px;bottom:0;padding:0 32px 14px;display:flex;flex-direction:column;box-sizing:border-box}
#final h2{margin:0;text-align:center;font-size:34px;font-weight:700;letter-spacing:-.02em}
#planNote{margin:6px auto 0;max-width:430px;text-align:center;font-size:13px;line-height:1.45;color:#A3A7B0}
/* min-height:0 lets the grid shrink and scroll when wider fonts (Segoe UI) wrap more, so .actions always stays on screen */
#cards{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3A3F48 transparent}
.card{display:flex;gap:10px;padding:9px 12px;border-radius:12px;background:#171A20;border:1px solid #262A32}
.cic{flex:none;width:30px;height:30px;border-radius:8px;background:rgba(255,90,43,.14);color:#FF7A4F;display:flex;align-items:center;justify-content:center}
.cname{font-size:13px;font-weight:600;line-height:1.3}
.csay{margin-top:3px;font-size:11.5px;line-height:1.4;color:#A3A7B0}
#cards.tight .card{padding:7px 10px;align-items:center}
#cards.tight .csay{display:none}
/* padding-top keeps a gap when the free-preview plan_note runs to four lines */
.actions{flex:none;margin-top:auto;padding-top:10px;display:flex;gap:10px}
#openClaude{flex:1;height:48px;border:0;border-radius:999px;background:var(--brand);color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
#openClaude:hover{background:#FF7040}
#done{width:120px;height:48px;border-radius:999px;border:1px solid #3A3F48;background:transparent;color:#F4F2EC;font:inherit;font-size:15px;font-weight:500;cursor:pointer}
#done:hover{background:#1E2229}
#final .rise,#final .card{opacity:0;animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
#final.calm .rise,#final.calm .card{animation:fade .4s ease-out forwards;animation-delay:0ms !important}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* flash + iris */
#flash{position:absolute;inset:0;z-index:3;background:#FFF8F0;pointer-events:none;animation:flashOut .45s ease-out forwards}
@keyframes flashOut{from{opacity:.95}to{opacity:0}}
#iris{position:absolute;left:-262px;top:-202px;width:1044px;height:1044px;border-radius:50%;overflow:hidden;z-index:4;pointer-events:none}
#iris svg{display:block;width:100%;height:100%}
.ib{fill:#14161B;stroke:#2C313A;stroke-width:.25;transform-box:fill-box;transform-origin:50% 100%;transform:rotate(70deg)}
#iris.close .ib{animation:irisShut .34s cubic-bezier(.55,0,.85,.35) forwards}
@keyframes irisShut{from{transform:rotate(70deg)}to{transform:rotate(0deg)}}
#iris.open{animation:irisZoom .65s cubic-bezier(.2,.7,.2,1) forwards}
#iris.open .ib{transform:rotate(0deg);animation:irisOpen .65s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes irisOpen{from{transform:rotate(0deg)}to{transform:rotate(84deg)}}
@keyframes irisZoom{0%{transform:scale(1);opacity:1}60%{opacity:1}100%{transform:scale(1.9);opacity:0}}
</style>
</head>
<body>
<div id="app">

<form id="form" autocomplete="off">
  <div id="lens" class="lens"><div class="glass">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g transform="translate(80 50) rotate(0)"><rect class="bl" x="-120" y="-120" width="240" height="120"/></g>
      <g transform="translate(68.705 73.455) rotate(51.429)"><rect class="bl" x="-120" y="-120" width="240" height="120"/></g>
      <g transform="translate(43.324 79.248) rotate(102.857)"><rect class="bl" x="-120" y="-120" width="240" height="120"/></g>
      <g transform="translate(22.971 63.017) rotate(154.286)"><rect class="bl" x="-120" y="-120" width="240" height="120"/></g>
      <g transform="translate(22.971 36.983) rotate(205.714)"><rect class="bl" x="-120" y="-120" width="240" height="120"/></g>
      <g transform="translate(43.324 20.752) rotate(257.143)"><rect class="bl" x="-120" y="-120" width="240" height="120"/></g>
      <g transform="translate(68.705 26.545) rotate(308.571)"><rect class="bl" x="-120" y="-120" width="240" height="120"/></g>
    </svg>
    <div class="glint"></div>
  </div></div>
  <p class="eyebrow mono">LL AGENT PRO</p>
  <h1>Activate Pro</h1>
  <p class="lede">Paste the license key from your purchase email or the thank-you page.</p>
  <label for="key">License key</label>
  <div id="field" class="field">
    <input id="key" class="mono" spellcheck="false" placeholder="e7925221-41d1-4dec-9afe-…">
    <button type="button" id="paste">Paste</button>
  </div>
  <div id="err" role="alert" hidden>
    <svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 8.5v4.5M12 16.5v.01M10.3 3.9 2.6 17.5a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    <div><strong id="errTitle"></strong><span id="errMsg"></span></div>
  </div>
  <button type="submit" id="activate" disabled>
    <svg id="spinner" class="ic spin" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden><path d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20M14.31 8l5.74 9.94M9.69 8h11.48M7.38 12l5.74-9.94M9.69 16 3.95 6.06M14.31 16H2.83M16.62 12l-5.74 9.94"/></svg>
    <span id="activateLabel" aria-live="polite">Activate Pro</span>
  </button>
  <p class="foot">Activation needs the internet. Works on up to 3 of your machines.<br><button type="button" id="plans" class="link">No key yet? See plans</button></p>
</form>

<div id="stage" hidden>
  <canvas id="storm" aria-hidden="true"></canvas>
  <div id="final" hidden>
    <h2 class="rise">You’re Pro.</h2>
    <p id="planNote" class="rise" style="animation-delay:110ms"></p>
    <div id="cards"></div>
    <div class="actions rise" style="animation-delay:720ms">
      <button type="button" id="openClaude">Open Claude</button>
      <button type="button" id="done">Done</button>
    </div>
  </div>
  <button type="button" id="skip" aria-label="Skip animation" hidden><span class="mono">CLICK TO SKIP</span></button>
</div>

<div id="flash" hidden></div>

<div id="iris" hidden>
  <svg viewBox="12 12 76 76" aria-hidden="true">
    <g transform="translate(80 50) rotate(0)"><rect class="ib" x="-120" y="-120" width="240" height="120"/></g>
    <g transform="translate(68.705 73.455) rotate(51.429)"><rect class="ib" x="-120" y="-120" width="240" height="120"/></g>
    <g transform="translate(43.324 79.248) rotate(102.857)"><rect class="ib" x="-120" y="-120" width="240" height="120"/></g>
    <g transform="translate(22.971 63.017) rotate(154.286)"><rect class="ib" x="-120" y="-120" width="240" height="120"/></g>
    <g transform="translate(22.971 36.983) rotate(205.714)"><rect class="ib" x="-120" y="-120" width="240" height="120"/></g>
    <g transform="translate(43.324 20.752) rotate(257.143)"><rect class="ib" x="-120" y="-120" width="240" height="120"/></g>
    <g transform="translate(68.705 26.545) rotate(308.571)"><rect class="ib" x="-120" y="-120" width="240" height="120"/></g>
  </svg>
</div>

<div id="bar" class="pywebview-drag-region">
  <div class="mark mono"><span class="dot"></span>LL AGENT</div>
  <button type="button" id="close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

</div>
<script>
(function () {
  "use strict";
  // Titles for activate_license()'s status values; the message itself comes from license.py.
  var TITLES = {
    invalid: "Key not found",
    inactive: "Key not active",
    limit_reached: "All 3 machines in use",
    offline: "Can’t reach the license server",
    error: "Something went wrong"
  };
  // One icon per entry of welcome.unlocked, in _PRO_FEATURES order.
  var ICONS = [
    "M5.8 8a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0-6.4 0M3.5 19c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6M14.6 9a2.4 2.4 0 1 0 4.8 0a2.4 2.4 0 1 0-4.8 0M15.8 14.5c2.2.2 4 1.7 4.7 4.5",
    "M6 7h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM8 4h10a2 2 0 0 1 2 2v11",
    "M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5M9.5 13h6M9.5 17h6",
    "M3.5 12a8.5 8.5 0 1 0 17 0a8.5 8.5 0 1 0-17 0M12 7.5V12l3 2",
    "M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12.8 9.5 10.6 13h3l-2.2 3.5",
    "M5.5 4h13a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 16v-3M12 16V9M16 16v-5"
  ];

  function byId(id) { return document.getElementById(id); }
  function reduced() { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

  var api = null, busy = false, timers = [], raf = 0, t0 = 0;
  function later(ms, fn) { timers.push(setTimeout(fn, ms)); }

  function sync() {
    byId("activate").disabled = !api || busy || byId("key").value.trim().length < 8;
  }
  function clearError() {
    byId("err").hidden = true;
    byId("field").classList.remove("bad", "shake");
  }
  function showError(status, message) {
    byId("errTitle").textContent = TITLES[status] || TITLES.error;
    byId("errMsg").textContent = message || "";
    byId("err").hidden = false;
    var f = byId("field");
    f.classList.remove("shake");
    void f.offsetWidth; // restart the shake
    f.classList.add("bad", "shake");
  }
  function setVerifying(on) {
    byId("lens").classList.toggle("hunt", on);
    byId("spinner").hidden = !on;
    byId("activateLabel").textContent = on ? "Checking your key…" : "Activate Pro";
  }

  window.addEventListener("pywebviewready", function () { api = window.pywebview.api; sync(); });
  byId("key").addEventListener("input", function () { clearError(); sync(); });
  byId("paste").addEventListener("click", function () {
    if (!api) return;
    api.paste().then(function (text) {
      if (text) { byId("key").value = text; clearError(); sync(); }
    });
  });
  byId("plans").addEventListener("click", function () { if (api) api.open_pricing(); });
  byId("close").addEventListener("click", function () { if (api) api.close(); });
  byId("done").addEventListener("click", function () { if (api) api.close(); });
  byId("openClaude").addEventListener("click", function () { if (api) api.open_claude(); });
  byId("skip").addEventListener("click", skip);

  byId("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy || !api) return;
    busy = true; sync(); clearError(); setVerifying(true);
    api.activate(byId("key").value).then(function (r) { return r; }, function (err) {
      return { status: "error", message: String(err) };
    }).then(function (r) {
      busy = false; setVerifying(false);
      if (r && r.status === "activated") { celebrate(r.welcome || {}); return; }
      showError(r && r.status, r && r.message); sync();
    });
  });

  function fillFinal(welcome) {
    byId("planNote").textContent = welcome.plan_note || "";
    var grid = byId("cards");
    grid.textContent = "";
    (welcome.unlocked || []).forEach(function (f, i) {
      var card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = (240 + i * 70) + "ms";
      var ic = document.createElement("div");
      ic.className = "cic";
      ic.innerHTML = '<svg class="ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="' + ICONS[i % ICONS.length] + '"/></svg>';
      var text = document.createElement("div");
      text.style.minWidth = "0";
      // welcome.unlocked is formatted for the chat reply: "<emoji> Name" and a
      // try_saying already in straight quotes. Here the SVG stands in for the
      // emoji, and the card adds its own curly quotes.
      var name = document.createElement("div");
      name.className = "cname";
      name.textContent = String(f.feature || "").split(" (")[0].replace(/^[^A-Za-z0-9]+/, "");
      var say = document.createElement("div");
      say.className = "csay";
      say.textContent = "“" + String(f.try_saying || "").replace(/"/g, "") + "”";
      text.append(name, say);
      card.append(ic, text);
      grid.append(card);
    });
  }

  function showStage() {
    byId("form").hidden = true;
    byId("stage").hidden = false;
    byId("bar").classList.add("dark");
  }
  function showFinal() {
    byId("skip").hidden = true;
    byId("final").hidden = false;
    fitCards();
  }
  // A wider font (Segoe UI) or a shorter window can overflow the grid: drop the
  // examples first, and only then let it scroll. offsetTop ignores the cards'
  // rise transform, so the mid-animation offset never trips this.
  function fitCards() {
    var grid = byId("cards"), last = grid.lastElementChild;
    if (last && last.offsetTop + last.offsetHeight - grid.offsetTop > grid.clientHeight) grid.classList.add("tight");
  }
  function skip() {
    timers.forEach(clearTimeout); timers = [];
    byId("iris").hidden = true; byId("flash").hidden = true;
    t0 = performance.now() - 3200;
    showFinal();
  }

  function celebrate(welcome) {
    fillFinal(welcome);
    if (reduced()) {
      byId("final").classList.add("calm");
      showStage(); startStorm(true); showFinal();
      return;
    }
    var iris = byId("iris");
    iris.className = "close"; iris.hidden = false;
    later(340, function () {
      showStage(); startStorm(false);
      byId("flash").hidden = false; byId("skip").hidden = false;
      iris.className = "open";
    });
    later(990, function () { iris.hidden = true; byId("flash").hidden = true; });
    later(2840, showFinal);
  }

  // Chaos → Order: ~286 photo tiles burst and swirl, then snap into a 26×11
  // grid where the PRO cells stay lit in colour bands sorted left → right.
  function startStorm(still) {
    var W = 520, H = 640, CX = 260, CY = 330, COLS = 26, ROWS = 11, PITCH = 14, SIZE = 11;
    var el = byId("storm"), dpr = window.devicePixelRatio || 1;
    el.width = W * dpr; el.height = H * dpr;
    var ctx = el.getContext("2d");
    t0 = performance.now() - (still ? 3200 : 0);

    var GLYPHS = [
      ["11110", "10001", "10001", "11110", "10000", "10000", "10000"],
      ["11110", "10001", "10001", "11110", "10100", "10010", "10001"],
      ["01110", "10001", "10001", "10001", "10001", "10001", "01110"]
    ];
    var lit = {};
    GLYPHS.forEach(function (g, li) {
      g.forEach(function (row, r) {
        row.split("").forEach(function (b, c) { if (b === "1") lit[(r + 2) * COLS + 3 + li * 7 + c] = true; });
      });
    });
    var PAL = [["#8EC8EA", "#3D6B4F"], ["#FFB36B", "#C2553A"], ["#F2D2BD", "#8A5A44"], ["#A6DCD6", "#2F6F7A"], ["#D9D4FF", "#5A4FA8"], ["#FFD36B", "#FF5A2B"]];
    var cells = [];
    for (var i = 0; i < COLS * ROWS; i++) cells.push(i);
    var letterCells = cells.filter(function (i) { return lit[i]; })
      .sort(function (a, b) { return (a % COLS) - (b % COLS) || a - b; });
    var otherCells = cells.filter(function (i) { return !lit[i]; })
      .sort(function () { return Math.random() - 0.5; });
    var tiles = cells.map(function () {
      return {
        pal: Math.floor(Math.random() * PAL.length),
        a0: Math.random() * Math.PI * 2,
        R: 50 + Math.random() * 230,
        w: (Math.random() < 0.5 ? -1 : 1) * (1.6 + Math.random() * 2.4),
        ph: Math.random() * 6.28,
        spin: (Math.random() - 0.5) * 12,
        delay: Math.random() * 260
      };
    });
    var idx = tiles.map(function (_, i) { return i; }).sort(function () { return Math.random() - 0.5; });
    idx.slice(0, letterCells.length)
      .sort(function (a, b) { return tiles[a].pal - tiles[b].pal; })
      .forEach(function (ti, k) { tiles[ti].cell = letterCells[k]; tiles[ti].lit = true; });
    idx.slice(letterCells.length).forEach(function (ti, k) { tiles[ti].cell = otherCells[k]; tiles[ti].lit = false; });

    function clamp(x) { return Math.max(0, Math.min(1, x)); }
    function oc(x) { return 1 - Math.pow(1 - x, 3); }
    function ioc(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

    function tile(x, y, sz, rot, t, alpha, glow) {
      var h = sz / 2;
      ctx.save();
      ctx.translate(x, y);
      if (rot) ctx.rotate(rot);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-h, -h, sz, sz, Math.max(1, sz * 0.2)); else ctx.rect(-h, -h, sz, sz);
      if (!t.lit && alpha < 1) { ctx.fillStyle = "#232730"; ctx.fill(); }
      ctx.clip();
      ctx.globalAlpha = alpha;
      if (glow) { ctx.shadowColor = PAL[t.pal][0]; ctx.shadowBlur = glow; }
      ctx.fillStyle = PAL[t.pal][1]; ctx.fillRect(-h, -h, sz, sz);
      ctx.fillStyle = PAL[t.pal][0]; ctx.fillRect(-h, -h, sz, sz * 0.55);
      ctx.restore();
    }

    function draw(now) {
      var t = now - t0;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#0E1014";
      ctx.fillRect(0, 0, W, H);
      var ce = ioc(clamp((t - 2250) / 650));
      var camY = CY + (100 - CY) * ce, s = 1 + (0.62 - 1) * ce;
      if (t > 1900 && t < 2700) {
        var q = (t - 1900) / 800;
        ctx.beginPath();
        ctx.arc(CX, camY, 40 + q * 380, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255,90,43," + (0.55 * (1 - q)) + ")";
        ctx.lineWidth = 2 + 6 * (1 - q);
        ctx.stroke();
      }
      var st = Math.min(t, 2000) / 1000, grow = 0.55 + 0.45 * oc(clamp(t / 300));
      tiles.forEach(function (tl) {
        var c = tl.cell % COLS, r = Math.floor(tl.cell / COLS);
        var tx = CX + s * (c * PITCH + PITCH / 2 - (COLS * PITCH) / 2);
        var ty = camY + s * (r * PITCH + PITCH / 2 - (ROWS * PITCH) / 2);
        var rr = tl.R * oc(clamp(t / 480)) * (1 + 0.18 * Math.sin(st * 5 + tl.ph));
        var ang = tl.a0 + tl.w * st * (1 - 0.25 * st);
        var sx = CX + Math.cos(ang) * rr, sy = CY + Math.sin(ang) * rr * 0.82;
        var p = ioc(clamp((t - 1050 - tl.delay) / 700));
        var size = SIZE * grow * (1 + (s - 1) * p), alpha = 1, glow = 0;
        if (tl.lit) {
          var wv = clamp((t - 1900 - c * 22) / 260);
          size *= 1 + 0.45 * Math.sin(Math.PI * wv);
          glow = wv > 0 && wv < 1 ? 14 : 0;
          if (t > 3000 && !still) alpha = 0.8 + 0.2 * Math.sin(now / 420 + c * 0.5 + r * 0.3);
        } else {
          alpha = 1 - 0.92 * clamp((t - 1750) / 450);
        }
        tile(sx + (tx - sx) * p, sy + (ty - sy) * p, size, tl.spin * st * (1 - p), tl, alpha, glow);
      });
      if (!still) raf = requestAnimationFrame(draw);
    }
    cancelAnimationFrame(raf);
    if (still) draw(performance.now()); else raf = requestAnimationFrame(draw);
  }
})();
</script>
